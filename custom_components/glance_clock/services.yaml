send_timer:
  name: "Send Timer"
  description: "Send a timer scene to the Glance Clock. The timer will run on the device."
  fields:
    countdown:
      name: "Countdown (seconds)"
      description: "Time before timer starts."
      required: false
      selector:
        number:
          min: 0
          max: 86400
          step: 1
    final_text:
      name: "Final Text (optional)"
      description: "Text to display when the timer finishes. Supports [icon:CODE] syntax."
      required: false
      selector:
        text:
    intervals:
      name: "Intervals (optional)"
      description: |
        List of timer intervals. Each interval can have:
          - text: string (supports [icon:CODE])
          - duration: seconds (int)
          - countdown: seconds (int, optional)
        Leave empty for a simple timer.
      required: true
      selector:
        object:
          label_field: text
          description_field: duration
          multiple: true
          fields:
            text:
              label: "Text"
              selector:
                text:
            duration:
              label: "Duration (seconds)"
              selector:
                number:
                  min: 1
                  max: 86400
                  step: 1
            countdown:
              label: "Countdown (seconds, optional)"
              selector:
                number:
                  min: 0
                  max: 86400
                  step: 1

update_display_settings:
  name: "Update Display Settings"
  description: "Update display settings on the Glance Clock"
  fields:
    nightModeEnabled:
      name: "Night Mode Enabled"
      description: "Enable automatic night mode"
      default: true
      selector:
        boolean:
    permanentMute:
      name: "Mute"
      description: "Permanently mute clock sounds"
      default: false
      selector:
        boolean:
    permanentDND:
      name: "Do Not Disturb"
      description: "Permanently suppress clock notifications"
      default: false
      selector:
        boolean:
    mgrUserActivityTimeout:
      name: "Activity Timeout"
      description: "Seconds before the clock returns from user activity"
      default: 600
      selector:
        number:
          min: 0
          max: 3600
          step: 10
          unit_of_measurement: s
    dnd:
      name: "DND Schedule"
      description: "Recurring DND schedule with recurring, fromHour, and tillHour fields"
      selector:
        object:
    silent:
      name: "Silent Schedule"
      description: "Recurring mute schedule with recurring, fromHour, and tillHour fields"
      selector:
        object:
    pointsAlwaysEnabled:
      name: "Points Always Enabled"
      description: "Always show time separator points"
      default: false
      selector:
        boolean:
    displayBrightness:
      name: "Display Brightness"
      description: "Screen brightness level (0-255, 0=auto). Note: Use the light entity for easier brightness control"
      default: 128
      selector:
        number:
          min: 0
          max: 255
          step: 1
    timeModeEnable:
      name: "Time Mode Enable"
      description: "Enable time display on the clock"
      default: true
      selector:
        boolean:
    timeFormat12:
      name: "12-Hour Format"
      description: "Use 12-hour format instead of 24-hour"
      default: false
      selector:
        boolean:
    dateFormat:
      name: "Date Format"
      description: "Date display format (0=Disabled, 1=24 Jan, 2=24 Tue, 3=Jan 24, 4=Tue 24)"
      default: 0
      selector:
        number:
          min: 0
          max: 4
          step: 1

send_notice:
  name: "Send Notice"
  description: "Send a notification notice to the Glance Clock"
  fields:
    text:
      name: "Text"
      description: |
        Message text to display. To insert an icon, use [icon:CODE] in your message (e.g., "Wake up! [icon:123]").

